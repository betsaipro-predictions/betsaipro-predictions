# Раз в сутки штампует HEAD-HASH цепочки (последнюю запись ledger.jsonl) в блокчейн
# Bitcoin через OpenTimestamps. Т.к. каждый hash включает предыдущий, печать головы
# фиксирует состояние ВСЕЙ истории до этой точки (правка №5). Бесплатно, без ключей.
name: timestamp-ledger
on:
  schedule:
    - cron: "17 3 * * *"   # ежедневно 03:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install OpenTimestamps client
        run: pip install opentimestamps-client
      - name: Write head-hash of the chain
        run: |
          test -f ledger.jsonl || { echo "ledger.jsonl нет — пропуск"; exit 0; }
          DATE=$(date -u +%Y-%m-%d)
          HEAD=$(tail -n 1 ledger.jsonl | python -c "import sys,json;print(json.loads(sys.stdin.read())['hash'])")
          SEQ=$(tail -n 1 ledger.jsonl | python -c "import sys,json;print(json.loads(sys.stdin.read())['seq'])")
          mkdir -p stamps
          echo "seq=$SEQ head_hash=$HEAD" > "stamps/$DATE.txt"
          echo "STAMP_FILE=stamps/$DATE.txt" >> "$GITHUB_ENV"
      - name: Stamp into Bitcoin (pending proof ~1s)
        run: |
          [ -n "$STAMP_FILE" ] && ots stamp "$STAMP_FILE" || echo "нечего штамповать"
      - name: Upgrade older pending proofs (embed Bitcoin attestation)
        run: |
          for f in stamps/*.ots; do [ -e "$f" ] && ots upgrade "$f" || true; done
        continue-on-error: true
      - name: Commit stamps
        run: |
          git config user.name "ledger-bot"
          git config user.email "ledger-bot@users.noreply.github.com"
          git add stamps/ || true
          git diff --cached --quiet || git commit -m "stamp: OpenTimestamps $(date -u +%F)"
          git push
